spring.application.name=servicehub-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DATABASE_USERNAME:servicehub}
spring.datasource.password=${DATABASE_PASSWORD:servicehub-dev-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.jwt.lifetime-seconds=${JWT_LIFETIME_SECONDS:900}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
